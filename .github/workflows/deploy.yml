name: Deploy to GitHub Pages

# 推送到 main 就自动构建并发布。
# 为什么用 Actions 而不是「部署分支」:构建产物 (dist/) 不该进仓库,
# 那样会让仓库臃肿且历史难读。Actions 每次在云端重新构建,干净。
on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署;新的推送取消排队中的旧任务,但不动正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 用 22 LTS:20 已过维护期,安全更新停止
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        # 不加文件名参数:让 Node 自动发现测试文件。
        # 注意不要写成 node --test "test/*.test.js" —— 引号会阻止 shell
        # 展开通配符,而 Node 20 不会自己 glob,于是报「找不到测试文件」。
        # 无参数的自动发现同时兼容 Windows 和 Linux。
        run: npm test

      - name: 构建
        run: npm run build

      # 断言产物齐全 —— 宁可构建失败,也不要发布一个「看起来能跑」的坏包
      - name: 校验构建产物
        run: |
          set -e
          test -f dist/index.html || { echo "缺少 index.html"; exit 1; }
          ls dist/assets/*.js >/dev/null || { echo "缺少 JS 产物"; exit 1; }
          ls dist/assets/*.css >/dev/null || { echo "缺少 CSS 产物"; exit 1; }
          echo "产物文件数: $(find dist -type f | wc -l)"

      # 浏览器端冒烟测试:构建成功 ≠ 浏览器里跑得起来。
      # 覆盖四条路径:隐藏元素/弹层、摄像头生命周期、上传照片、实时摄像头,
      # 并断言测量数值正确。runner 上装了 Chrome,用假的摄像头视频流
      # 即可无人值守跑通摄像头路径。
      - name: 浏览器冒烟测试(弹层 + 生命周期 + 照片 + 摄像头)
        run: |
          set -e
          npx vite preview --port 4173 --strictPort &
          PREVIEW_PID=$!

          # 等服务器起来。显式判断是否真的起来了 —— 否则连不上时
          # 测试会给出「页面加载失败」这种误导性的错误,浪费时间排查。
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ > /dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "预览服务器 30 秒内没有就绪"
            kill $PREVIEW_PID 2>/dev/null || true
            exit 1
          fi

          node tools/smoke-hidden.mjs http://localhost:4173/
          node tools/smoke-camera-lifecycle.mjs http://localhost:4173/
          node tools/smoke.mjs http://localhost:4173/
          node tools/smoke-camera.mjs http://localhost:4173/

          kill $PREVIEW_PID 2>/dev/null || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4